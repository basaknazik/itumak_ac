name: Anket yanıtlarını senkronize et

on:
  schedule:
    # Her saat başı çalışır (UTC). GitHub Actions'ın ücretsiz cron zamanlaması
    # birkaç dakika gecikebilir, bu normaldir.
    - cron: "0 * * * *"
  workflow_dispatch: {}   # istersen Actions sekmesinden elle de tetikleyebilirsin

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Repo'yu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Yeni yanıtları çek
        id: sync
        run: python3 scripts/sync_responses.py

      - name: Değişiklik var mı kontrol et
        id: diff
        run: |
          if git diff --quiet -- data/responses.csv data/seen.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull Request aç
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Yeni anket yanıtları"
          branch: sync-responses
          delete-branch: true
          title: "Yeni anket yanıtları — onayınızı bekliyor"
          body-path: data/.sync_summary.txt
          add-paths: |
            data/responses.csv
            data/seen.json
